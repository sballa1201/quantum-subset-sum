[project]
name = "quantum-subset-sum"
version = "0.1.0"
description = "A quantum algorithm for the subset sum problem."
readme = "README.md"
authors = [
    { name = "Shashi Balla" }
]
requires-python = ">=3.13"
dependencies = ["numpy", "matplotlib", "pytest", "qiskit", "ipykernel", "pylatexenc", "sympy"]

[project.scripts]
quantum-subset-sum = "quantum_subset_sum:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
